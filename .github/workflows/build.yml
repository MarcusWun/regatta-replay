name: Build

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  release:
    types: [created]

jobs:
  test:
    name: Frontend tests + typecheck
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: replay-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: replay-app/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Coverage report
        run: npm run test:coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: replay-app/coverage
          retention-days: 14

  build:
    name: Build ${{ matrix.target }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-22.04
            tauri_args: ''
            artifact_glob: |
              replay-app/src-tauri/target/release/bundle/appimage/*.AppImage
              replay-app/src-tauri/target/release/bundle/deb/*.deb
          - target: windows
            os: windows-latest
            tauri_args: ''
            artifact_glob: |
              replay-app/src-tauri/target/release/bundle/msi/*.msi
              replay-app/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: replay-app
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libayatana-appindicator3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: replay-app/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './replay-app/src-tauri -> target'

      - name: Install npm deps
        run: npm ci

      - name: Tauri build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: replay-app
          args: ${{ matrix.tauri_args }}

      - name: Upload ${{ matrix.target }} installer
        uses: actions/upload-artifact@v4
        with:
          name: regatta-replay-${{ matrix.target }}
          path: ${{ matrix.artifact_glob }}
          retention-days: 14
          if-no-files-found: warn
